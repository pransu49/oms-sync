name: Robot watchdog

on:
  workflow_run:
    workflows: ['Push LOTS stock to OMS Guru']
    types: [completed]
  schedule:
    - cron: '20 * * * *'   # backup, every hour
  push:
    branches: [claude/robot-watchdog]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = test, no Telegram message'
        required: false
        default: 'false'

concurrency:
  group: robot-audit
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - run: node robot-audit.js
        env:
          FIREBASE_SERVICE_ACCOUNT_SPAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPAPI }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'push' && 'true' || inputs.dry_run || 'false' }}

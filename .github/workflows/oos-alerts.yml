name: LOTS low stock alert (Telegram)

# Every hour 9 am - 9 pm IST. Costs 1 Firebase read when LOTS stock was not re-uploaded;
# reads the catalogue only after a new LOTS upload.
on:
  # main trigger: piggy-back on the OMS sync (started every 10 min by cron-job.org) - the gate keeps 1 per hour
  workflow_run:
    workflows: ['Sync OMS Guru Orders']
    types: [completed]
  schedule:
    - cron: '35 3-15 * * *'   # backup only - GitHub's own timer often skips
  workflow_dispatch:
    inputs:
      force:
        description: 'true = send the full low-stock check now even if LOTS was not re-uploaded'
        default: 'false'

concurrency:
  group: oos-alerts
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        shell: bash
        run: |
          h=$((10#$(TZ=Asia/Kolkata date +%H))); mi=$((10#$(TZ=Asia/Kolkata date +%M)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          if [ $h -lt 9 ] || [ $h -gt 21 ]; then echo "go=0" >> $GITHUB_OUTPUT; echo "skip: outside 9 am - 9 pm IST"; exit 0; fi
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ $mi -ge 10 ]; then echo "go=0" >> $GITHUB_OUTPUT; echo "skip: not the hourly slot"; exit 0; fi
          echo "go=1" >> $GITHUB_OUTPUT

  oos:
    needs: gate
    if: ${{ needs.gate.outputs.go == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund firebase-admin
      - run: node oos-alerts.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ inputs.force || 'false' }}

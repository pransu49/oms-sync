name: Complaints probe (read-only test)
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save amazon-sp-api
      - run: node complaints-probe.js
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          T_SASTA: ${{ secrets.SPAPI_REFRESH_TOKEN_SASTASTORE }}
          T_PRASO: ${{ secrets.SPAPI_REFRESH_TOKEN }}

name: Access log review (every 2 weeks)

# Amazon restricted-role rule: audit logs reviewed every 2 weeks and kept 12 months.
# Reads the last 14 days of OMS Firebase aikm_audit (~1-3k reads, twice a month) + GitHub robot runs,
# sends the owner a Telegram review, saves it in aikm_auditReview/<date>, deletes access records older than 400 days.
on:
  schedule:
    - cron: '17 4 1,15 * *'      # 1st and 15th, ~9:47 AM IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = only print, save nothing, no Telegram'
        default: 'false'

permissions:
  actions: read
  contents: read

concurrency:
  group: audit-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: node audit-review.js
        env:
          FIREBASE_SERVICE_ACCOUNT_OMS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

name: Push LOTS stock to OMS Guru

on:
  # main trigger: piggy-back on the OMS order sync (started every 10 min by cron-job.org - reliable); the gate keeps 1 run per hour
  workflow_run:
    workflows: ['Sync OMS Guru Orders']
    types: [completed]
  schedule:
    - cron: '50 * * * *'   # backup only - GitHub's own timer often skips
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = test run, nothing sent to OMS Guru'
        required: false
        default: 'false'

concurrency:
  group: oms-inventory-push
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          # run when the last successful/started push is 50+ min old
          last=$(gh api "repos/${{ github.repository }}/actions/workflows/oms-inventory-push.yml/runs?per_page=10&branch=main" --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.conclusion=="success" or .status!="completed") | .created_at][0] // ""')
          if [ -z "$last" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          age=$(( $(date -u +%s) - $(date -u -d "$last" +%s) ))
          echo "last push started $age s ago"
          if [ $age -ge 3000 ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "go=0" >> $GITHUB_OUTPUT; fi

  push:
    needs: gate
    if: ${{ needs.gate.outputs.go == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund
      - shell: bash
        run: node oms-inventory-push.js 2>&1 | tee run.log; exit ${PIPESTATUS[0]}
        env:
          OMS_EMAIL: ${{ secrets.OMS_EMAIL }}
          OMS_PASSWORD: ${{ secrets.OMS_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_SPAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPAPI }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Report sync health to console
        if: always()
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node report-health.js oms-inventory "LOTS stock to OMS" run.log || true

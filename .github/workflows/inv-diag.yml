name: Central inventory check (read-only)
on:
  workflow_dispatch:
    inputs:
      acct: { description: 'Account: sastastore / praso / vishal / munda / aikm', required: false, default: 'sastastore' }
      asins: { description: 'Optional: ASINs to look up in the saved mappings (space/comma separated)', required: false, default: '' }
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save firebase-admin@12
      - run: node tools/inv-diag.js
        env:
          ACCT: ${{ inputs.acct }}
          ASINS: ${{ inputs.asins }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_SPAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPAPI }}

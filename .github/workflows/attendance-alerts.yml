name: Attendance alerts (Telegram)

on:
  # main trigger: right after every OMS sync (started every 10 min by cron-job.org)
  workflow_run:
    workflows: ['Sync OMS Guru Orders']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'   # backup only - GitHub's own timer often skips
  workflow_dispatch: {}      # "Run workflow" button = check now

concurrency:
  group: attendance-alerts
  cancel-in-progress: false

jobs:
  attendance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund firebase-admin
      - run: node attendance-alerts.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_SERVICE_ACCOUNT_ATTENDANCE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ATTENDANCE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

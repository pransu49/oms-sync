name: tmp fix
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet firebase-admin==6.5.0 pymupdf==1.24.10
      - shell: python
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          import json, os, re, firebase_admin, pymupdf
          from firebase_admin import credentials, storage
          app = firebase_admin.initialize_app(credentials.Certificate(json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT'])))
          b = storage.bucket('aikm-shipping-labels').blob('labels/manual_1791917268.pdf').download_as_bytes()
          d = pymupdf.open(stream=b, filetype='pdf'); print('PAGES', len(d))
          sizes = {}
          for p in d: k = (round(p.rect.width), round(p.rect.height)); sizes[k] = sizes.get(k, 0) + 1
          print('SIZES', sizes)
          prev = None
          for i in range(len(d)):
              t = d[i].get_text()
              m = re.search(r'Order No:\s*(\S+)', t)
              lines = [l for l in t.split('\n') if l.strip()]
              tail = ' / '.join(lines[-6:])[:160]
              if i < 25 or i % 100 == 0: print('P', i + 1, (m.group(1) if m else 'ATS'), '|', tail)
          d[0].get_pixmap(dpi=80).save('p0.png')

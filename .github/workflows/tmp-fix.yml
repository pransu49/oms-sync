name: tmp fix
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: pip install --quiet google-auth requests
      - shell: python
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          import json, os, requests
          from google.oauth2 import service_account
          import google.auth.transport.requests as gr
          info = json.loads(os.environ['FIREBASE_SERVICE_ACCOUNT']); p = info['project_id']
          c = service_account.Credentials.from_service_account_info(info, scopes=['https://www.googleapis.com/auth/cloud-platform'])
          c.refresh(gr.Request()); H = {'Authorization': 'Bearer ' + c.token}
          rel = requests.get(f'https://firebaserules.googleapis.com/v1/projects/{p}/releases', headers=H).json()
          for r in rel.get('releases', []):
              if 'firestore' in r['name']:
                  rs = requests.get('https://firebaserules.googleapis.com/v1/' + r['rulesetName'], headers=H).json()
                  for f in rs['source']['files']: print('RULES', f['content'].replace(p, 'PID').replace('\n', ' || '))

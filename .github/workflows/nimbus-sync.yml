name: NimbusPost Sync

on:
  workflow_dispatch:
    inputs:
      debug_order:
        required: false
        default: ''
  schedule:
    - cron: '*/30 * * * *'   # backup only — GitHub's own timer often skips hours
  # main trigger: piggy-back on the OMS sync (reliably started every 10 min by cron-job.org)
  workflow_run:
    workflows: ['Sync OMS Guru Orders']
    types: [completed]

# never two runs at once
concurrency:
  group: nimbus-sync
  cancel-in-progress: false

jobs:
  # after an OMS run, only go ahead every ~30 min (runs starting at :00-:09 or :30-:39)
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        shell: bash
        run: |
          m=$(date -u +%M); m=$((10#$m))
          if [ "${{ github.event_name }}" != "workflow_run" ] || [ $((m % 30)) -lt 10 ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "go=0" >> $GITHUB_OUTPUT; echo "skip: not a 30-min slot"; fi

  sync:
    needs: gate
    if: ${{ needs.gate.outputs.go == '1' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - shell: bash
        run: node nimbus-sync.js 2>&1 | tee run.log
        env:
          NIMBUS_API_KEY: ${{ secrets.NIMBUS_API_KEY }}
          NIMBUS_API_SECRET: ${{ secrets.NIMBUS_API_SECRET }}
          DEBUG_ORDER: ${{ inputs.debug_order || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Report sync health to console
        if: always()
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
        run: node report-health.js nimbus "NimbusPost sync" run.log || true

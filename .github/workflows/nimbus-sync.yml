name: NimbusPost Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'   # every 30 min (cron-job.org can also trigger it, like the OMS sync)

# never two runs at once
concurrency:
  group: nimbus-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - run: node nimbus-sync.js
        env:
          NIMBUS_API_KEY: ${{ secrets.NIMBUS_API_KEY }}
          NIMBUS_API_SECRET: ${{ secrets.NIMBUS_API_SECRET }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

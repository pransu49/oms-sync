name: Make ProShip job for order ids (owner list)
on:
  workflow_dispatch:
    inputs:
      ids: { description: 'Amazon order ids', required: true }
      buyers: { description: 'Buyer addresses JSON {orderId:{n,a1,a2,c,s,z}} (optional; read from the event file, never printed)', required: false, default: '' }
      save_only: { description: 'true = only save the phones, do not ship', required: false, default: 'false' }
      phones: { description: 'Buyer phones orderId:phone,... (optional; masked in logs)', required: false, default: '' }
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: npm install --no-save firebase-admin@12
      - name: Mask phones
        env: { PHONES: '${{ inputs.phones }}' }
        run: for t in ${PHONES//,/ }; do echo "::add-mask::${t#*:}"; done
      - run: node tools/ship-ids.js
        env:
          IDS: ${{ inputs.ids }}
          PHONES: ${{ inputs.phones }}
          SAVE_ONLY: ${{ inputs.save_only }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

name: RTO probe (read-only test)
on:
  workflow_dispatch:
    inputs:
      ids: { description: 'tracking IDs, comma separated', default: '' }
      order: { description: 'Amazon order id', default: '' }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install --no-save amazon-sp-api
      - run: node rto-probe.js
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SPAPI_REFRESH_TOKEN_PRASO: ${{ secrets.SPAPI_REFRESH_TOKEN }}
          PROBE_IDS: ${{ inputs.ids }}
          PROBE_ORDER: ${{ inputs.order }}

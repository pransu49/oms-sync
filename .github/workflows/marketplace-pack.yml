name: Meesho + Snapdeal - pack and labels

on:
  # Daily auto-run at 10 AM IST, every day.
  # The OMS Guru sync runs every 10 min (cron-job.org, reliable). After each sync the "gate" job checks:
  # after 10:00 AM IST and not yet started today -> start the robot ONCE.
  workflow_run:
    workflows: ['Sync OMS Guru Orders']
    types: [completed]
  # GitHub's own timer as a backup (10:00 AM IST; it often fires late, the gate stops duplicates)
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = only list what would be packed (nothing is packed)'
        default: 'false'
      limit:
        description: 'pack at most this many orders (0 = all)'
        default: '0'
      channels:
        description: 'channels to process'
        default: 'Meesho,Snapdeal'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.decide.outputs.go }}
      auto: ${{ steps.when.outputs.auto }}
    steps:
      - name: When
        id: when
        shell: bash
        run: |
          EV="${{ github.event_name }}"
          IST_DATE=$(TZ=Asia/Kolkata date +%F); HM=$(TZ=Asia/Kolkata date +%H%M)
          echo "day=$IST_DATE" >> $GITHUB_OUTPUT
          if [ "$EV" = "workflow_dispatch" ]; then echo "auto=false" >> $GITHUB_OUTPUT; echo "go=true" >> $GITHUB_OUTPUT; exit 0; fi
          echo "auto=true" >> $GITHUB_OUTPUT
          # Daily auto-run switch: off until the first test run is checked
          AUTO_ON=true
          if [ "$AUTO_ON" != "true" ]; then echo "Daily auto-run is switched off"; echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          if [ "$((10#$HM))" -lt 1000 ] || [ "$((10#$HM))" -gt 1800 ]; then
            echo "Outside 10:00 AM - 6:00 PM IST ($HM)"; echo "go=false" >> $GITHUB_OUTPUT; exit 0; fi
          echo "go=check" >> $GITHUB_OUTPUT
      - name: Already started today?
        id: done
        if: steps.when.outputs.go == 'check'
        uses: actions/cache/restore@v4
        with:
          path: .mp-auto
          key: mp-auto-${{ steps.when.outputs.day }}
          lookup-only: true
      - name: Decide
        id: decide
        shell: bash
        run: |
          if [ "${{ steps.when.outputs.go }}" = "true" ]; then echo "go=true" >> $GITHUB_OUTPUT
          elif [ "${{ steps.when.outputs.go }}" = "check" ] && [ "${{ steps.done.outputs.cache-hit }}" != "true" ]; then echo "go=true" >> $GITHUB_OUTPUT
          else echo "Nothing to do now."; echo "go=false" >> $GITHUB_OUTPUT; fi
      - name: Mark today's auto-run as started
        if: steps.decide.outputs.go == 'true' && steps.when.outputs.auto == 'true'
        shell: bash
        run: mkdir -p .mp-auto && date > .mp-auto/started
      - uses: actions/cache/save@v4
        if: steps.decide.outputs.go == 'true' && steps.when.outputs.auto == 'true'
        with:
          path: .mp-auto
          key: mp-auto-${{ steps.when.outputs.day }}

  pack:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    concurrency:
      group: marketplace-pack
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save cheerio@1.0.0 pdf-lib@1.17.1 firebase-admin@12
      - shell: bash
        run: node marketplace-pack.js 2>&1 | tee run.log
        env:
          OMS_EMAIL: ${{ secrets.OMS_EMAIL }}
          OMS_PASSWORD: ${{ secrets.OMS_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          LIMIT: ${{ inputs.limit || '0' }}
          CHANNELS: ${{ inputs.channels || 'Meesho,Snapdeal' }}
          TRIGGER: ${{ needs.gate.outputs.auto == 'true' && 'schedule' || 'manual' }}

      - name: Report sync health to console
        if: always()
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node report-health.js mppack "Meesho + Snapdeal labels" run.log || true

name: Meesho panel robot (office PC)
# Runs on the office Windows PC (self-hosted Windows runner DESKTOP-7C3H54H) because Meesho blocks cloud servers.
# login = open Chrome on the PC so the owner signs in once · check = read-only test, result on Telegram
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'login, check (read only) or process (accept + labels)'
        default: 'check'
      account:
        description: 'Meesho account short name'
        default: 'noworry'
      limit:
        description: 'process at most this many pending orders (0 = all)'
        default: '1'
      orders:
        description: 'also download labels for these order IDs (comma separated, optional)'
        default: ''
jobs:
  run:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd   # Windows blocks PowerShell scripts on this PC; plain cmd works
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save playwright@1.47.2
      - run: npx playwright install chromium
      - run: node meesho-panel.js
        env:
          MODE: ${{ inputs.mode }}
          ACCOUNT: ${{ inputs.account }}
          LIMIT: ${{ inputs.limit }}
          ORDERS: ${{ inputs.orders }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

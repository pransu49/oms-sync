name: tmp rejected check
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: npm install --no-save firebase-admin@12 >/dev/null 2>&1
      - shell: node {0}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          const admin = require(process.cwd() + '/node_modules/firebase-admin');
          admin.initializeApp({ credential: admin.credential.cert(JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT)) });
          (async () => {
            const db = admin.firestore();
            const p = (await db.collection('aikm_admin').doc('omsTrackingPush').get()).data() || {};
            const stuck = p.stuck || {}, failed = (p.last && p.last.failed) || {};
            const by = (o, f) => { const m = {}; Object.values(o).forEach((v) => { const k = f(v); m[k] = (m[k] || 0) + 1; }); return m; };
            console.log('PUSH last', JSON.stringify({ at: p.last && p.last.at && p.last.at.toDate(), msg: p.last && p.last.message }));
            console.log('STUCK', Object.keys(stuck).length, JSON.stringify(by(stuck, (v) => (v.ch || '?') + ' | ' + (v.st || '?'))));
            const ages = Object.values(stuck).map((v) => v.t || v.at || 0); console.log('STUCK keys sample', JSON.stringify(Object.entries(stuck).slice(0, 3)));
            console.log('FAILED', Object.keys(failed).length, JSON.stringify(by(failed, (v) => String(v).slice(0, 80))));
            const a = (await db.collection('aikm_admin').doc('amazonConfirm').get()).data() || {};
            const ids = a.ids || {}; const bad = Object.entries(ids).filter(([k, v]) => v && !v.ok);
            console.log('AMZ failed', bad.length, JSON.stringify(by(Object.fromEntries(bad), (v) => (v.acct || '?') + ' | ' + String(v.e || '').slice(0, 90))));
            const now = Date.now(); console.log('AMZ ages(days)', JSON.stringify(by(Object.fromEntries(bad), (v) => Math.floor((now - (v.t || 0)) / 864e5))));
            console.log('AMZ sample', JSON.stringify(bad.slice(0, 3).map(([k, v]) => [k, v.acct, v.t && new Date(v.t).toISOString(), String(v.e).slice(0, 200)])));
          })();

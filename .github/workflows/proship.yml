name: ProShip

# ProShip (Prozo) courier robot for Amazon self-ship orders — started by the console (Self-Ship -> ProShip). No schedule.
#   check  = sign in + read live rates (creates nothing)      ship   = create the shipments of a console job
#   sync   = refresh status of live ProShip AWBs              cancel = cancel the AWBs given
on:
  # status refresh (in transit / delivered / RTO) every 30 min, like NimbusPost (owner 13 Nov 2026).
  # Finishes in seconds with 0 ProShip calls when there are no live ProShip shipments.
  # GitHub's own timer skips most runs (owner 25 Nov 2026: refresh came only every 4-6 h), so the MAIN trigger is the OMS sync,
  # which cron-job.org starts every 10 min; the gate below lets only one refresh through per 30 min. The schedule stays as a backup.
  schedule:
    - cron: '7,37 * * * *'
  workflow_run:
    workflows: ['Sync OMS Guru Orders']
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: 'check | ship | sync | cancel | selftest (selftest = practice run on the ProShip sandbox, dummy order only)'
        required: false
        default: 'check'
      job_id:
        description: 'ship: console job (proshipJobs/<id>) — set by the console'
        required: false
        default: ''
      awbs:
        description: 'cancel: AWB numbers, comma separated'
        required: false
        default: ''
      from_pin:
        description: 'check: pickup pincode to test rates from (blank = the one saved in the console)'
        required: false
        default: ''

# never two ship/cancel runs at once. The status refresh has its OWN queue, so a scheduled refresh can never
# push a waiting ship job out of the queue (GitHub keeps only one waiting run per group). Index writes are transactions.
concurrency:
  group: proship-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.mode == 'sync') && 'sync' || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to start "Push tracking to OMS Guru" after shipments are made

jobs:
  # after an OMS run, refresh only in the :00-:09 and :30-:39 slots (= every 30 min)
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        shell: bash
        run: |
          m=$(date -u +%M); m=$((10#$m))
          if [ "${{ github.event_name }}" != "workflow_run" ] || [ $((m % 30)) -lt 10 ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "go=0" >> $GITHUB_OUTPUT; echo "skip: not a 30-min slot"; fi

  proship:
    needs: gate
    if: ${{ needs.gate.outputs.go == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 1,500 orders ≈ 15–25 min; generous so a big job is never cut off
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - name: Restore saved OMS orders copy
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/oms-chunks.json
          key: omsorders-${{ github.run_id }}
          restore-keys: omsorders-

      - id: run
        shell: bash
        run: set -o pipefail; node proship.js 2>&1 | tee run.log
        env:
          MODE: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_run') && 'sync' || inputs.mode || 'check' }}
          JOB_ID: ${{ inputs.job_id }}
          AWBS: ${{ inputs.awbs }}
          FROM_PIN: ${{ inputs.from_pin }}
          # selftest runs on ProShip's sandbox with its own login; every other mode uses the live account
          PROSHIP_BASE: ${{ github.event_name != 'schedule' && inputs.mode == 'selftest' && 'https://proshipdev.prozo.com' || 'https://proship.prozo.com' }}
          PROSHIP_USERNAME: ${{ inputs.mode == 'selftest' && secrets.PROSHIP_SANDBOX_USERNAME || secrets.PROSHIP_USERNAME }}
          PROSHIP_PASSWORD: ${{ inputs.mode == 'selftest' && secrets.PROSHIP_SANDBOX_PASSWORD || secrets.PROSHIP_PASSWORD }}
          PS_DEBUG_KEYS: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'sync' && '1' || '' }}
          FIREBASE_SERVICE_ACCOUNT: ${{ inputs.mode != 'selftest' && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
          FIREBASE_SERVICE_ACCOUNT_OMS: ${{ inputs.mode != 'selftest' && secrets.FIREBASE_SERVICE_ACCOUNT_OMS || '' }}

      # ATS label "Ship Date" -> proshipIndex (owner 23 Nov 2026). Only after status refreshes; never fails the run.
      - name: Read ATS label ship dates
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_run' || inputs.mode == 'sync' || inputs.mode == 'ship') }}
        continue-on-error: true
        timeout-minutes: 20
        run: node tools/ats-shipdate.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROSHIP_USERNAME: ${{ secrets.PROSHIP_USERNAME }}
          PROSHIP_PASSWORD: ${{ secrets.PROSHIP_PASSWORD }}

      # new AWBs -> OMS Guru right away (Amazon is confirmed after the next OMS sync), same as NimbusPost / Zippy
      - name: Keep OMS orders copy for the next run
        if: always() && hashFiles('.cache/oms-chunks.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/oms-chunks.json
          key: omsorders-${{ hashFiles('.cache/oms-chunks.json') }}

      - name: Push tracking to OMS Guru
        if: ${{ steps.run.outputs.shipped != '' && steps.run.outputs.shipped != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run oms-push-tracking.yml --repo ${{ github.repository }} --ref main -f dry_run=false || true

      - name: Report health to console
        if: ${{ always() && inputs.mode != 'selftest' }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node report-health.js proship "ProShip" run.log || true

name: ProShip

# ProShip (Prozo) courier robot for Amazon self-ship orders — started by the console (Self-Ship -> ProShip). No schedule.
#   check  = sign in + read live rates (creates nothing)      ship   = create the shipments of a console job
#   sync   = refresh status of live ProShip AWBs              cancel = cancel the AWBs given
on:
  # status refresh (in transit / delivered / RTO) every 30 min, like NimbusPost (owner 13 Nov 2026).
  # Finishes in seconds with 0 ProShip calls when there are no live ProShip shipments.
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'check | ship | sync | cancel | selftest (selftest = practice run on the ProShip sandbox, dummy order only)'
        required: false
        default: 'check'
      job_id:
        description: 'ship: console job (proshipJobs/<id>) — set by the console'
        required: false
        default: ''
      awbs:
        description: 'cancel: AWB numbers, comma separated'
        required: false
        default: ''
      from_pin:
        description: 'check: pickup pincode to test rates from (blank = the one saved in the console)'
        required: false
        default: ''

# never two ship/cancel runs at once. The status refresh has its OWN queue, so a scheduled refresh can never
# push a waiting ship job out of the queue (GitHub keeps only one waiting run per group). Index writes are transactions.
concurrency:
  group: proship-${{ (github.event_name == 'schedule' || inputs.mode == 'sync') && 'sync' || 'main' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # to start "Push tracking to OMS Guru" after shipments are made

jobs:
  proship:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 1,500 orders ≈ 15–25 min; generous so a big job is never cut off
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install firebase-admin
      - id: run
        shell: bash
        run: set -o pipefail; node proship.js 2>&1 | tee run.log
        env:
          MODE: ${{ github.event_name == 'schedule' && 'sync' || inputs.mode || 'check' }}
          JOB_ID: ${{ inputs.job_id }}
          AWBS: ${{ inputs.awbs }}
          FROM_PIN: ${{ inputs.from_pin }}
          # selftest runs on ProShip's sandbox with its own login; every other mode uses the live account
          PROSHIP_BASE: ${{ github.event_name != 'schedule' && inputs.mode == 'selftest' && 'https://proshipdev.prozo.com' || 'https://proship.prozo.com' }}
          PROSHIP_USERNAME: ${{ inputs.mode == 'selftest' && secrets.PROSHIP_SANDBOX_USERNAME || secrets.PROSHIP_USERNAME }}
          PROSHIP_PASSWORD: ${{ inputs.mode == 'selftest' && secrets.PROSHIP_SANDBOX_PASSWORD || secrets.PROSHIP_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ inputs.mode != 'selftest' && secrets.FIREBASE_SERVICE_ACCOUNT || '' }}
          FIREBASE_SERVICE_ACCOUNT_OMS: ${{ inputs.mode != 'selftest' && secrets.FIREBASE_SERVICE_ACCOUNT_OMS || '' }}

      # new AWBs -> OMS Guru right away (Amazon is confirmed after the next OMS sync), same as NimbusPost / Zippy
      - name: Push tracking to OMS Guru
        if: ${{ steps.run.outputs.shipped != '' && steps.run.outputs.shipped != '0' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run oms-push-tracking.yml --repo ${{ github.repository }} --ref main -f dry_run=false || true

      - name: Report health to console
        if: ${{ always() && inputs.mode != 'selftest' }}
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node report-health.js proship "ProShip" run.log || true

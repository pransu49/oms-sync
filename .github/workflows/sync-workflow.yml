name: Sync OMS Guru Orders

on:
  workflow_dispatch: {}      # triggered every 15 min by cron-job.org — GitHub's own
                              # free-tier `schedule:` trigger was removed here: running
                              # both side-by-side caused overlapping runs that raced each
                              # other writing to Firestore, leaving stale data behind
                              # even though every individual run reported success.

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm install

      - name: Run sync
        env:
          OMS_EMAIL: ${{ secrets.OMS_EMAIL }}
          OMS_PASSWORD: ${{ secrets.OMS_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OMS_DAYS_BACK: '15'
        run: node sync.js

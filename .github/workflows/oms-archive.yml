name: OMS Archive (for Auto sale bills)

# Saves the last N days of SHIPPED orders to aikm_admin/omsArchive so Auto sale bills
# can bill dates older than the live 15-day window. Runs on command, and once a day.
on:
  workflow_dispatch:
    inputs:
      days:
        description: 'How many days back'
        default: '40'
  schedule:
    - cron: '41 20 * * *'   # ~2:11 AM India time

# Same group as the live OMS sync, so the two never log in to OMS Guru at the same time.
concurrency:
  group: oms-guru-sync
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Save shipped orders archive
        env:
          OMS_EMAIL: ${{ secrets.OMS_EMAIL }}
          OMS_PASSWORD: ${{ secrets.OMS_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMS }}
          OMS_DAYS_BACK: ${{ github.event.inputs.days || '40' }}
          OMS_ARCHIVE_DOC: omsArchive
        run: node sync.js

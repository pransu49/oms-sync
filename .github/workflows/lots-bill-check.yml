name: LOTS-GN Bill Check

on:
  # GitHub's own timer is unreliable (fired 2x in 2 days, hours late). Ride on the OMS sync, which
  # cron-job.org starts every 10 min; the gate below lets it through only 10 AM - 8 PM IST.
  workflow_run:
    workflows: ['Sync OMS Guru Orders']
    types: [completed]
  schedule:
    - cron: '*/30 4-14 * * *'   # backup only
  push:
    branches: [main]
    paths: ['lots-bill-check.js', '.github/workflows/lots-bill-check.yml']   # test run right after an update (log only, no Telegram)
  workflow_dispatch:
    inputs:
      bill:
        description: 'Re-check one bill now (e.g. 1061027IN/005527). Leave empty for a normal run.'
        required: false
        default: ''

concurrency:
  group: lots-bill-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Only inside the bill window (10 AM – 8 PM IST) unless started by hand
        id: gate
        run: |
          H=$(TZ=Asia/Kolkata date +%H)
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$H" -ge 10 ] && [ "$H" -lt 20 ]; }; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "Outside 10 AM–8 PM IST - skipping."; fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: '20'

      - name: Install (no browser needed)
        if: steps.gate.outputs.go == 'true'
        run: npm install --no-save --ignore-scripts firebase-admin@12 pdfjs-dist@3.11.174 pdf-lib@1.17.1

      - name: Compare today's LOTS-GN bill with the ordered cart
        if: steps.gate.outputs.go == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node lots-bill-check.js "${{ github.event.inputs.bill }}" ${{ github.event_name == 'push' && '--dry' || '' }}   # after a code update: dry run (log only)

      - name: Telegram alert if the check crashed
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || exit 0
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🔴 LOTS-GN bill check robot failed. Details: ${RUN_URL}" > /dev/null || true

name: SP-API Sync (AIKM Pharma)

on:
  schedule:                  # offset from the other 4 accounts so the five accounts don't run at the same minute
    - cron: '32 */2 * * *'   # FULL sync (incl. competitor prices)
    - cron: '2,17,47 * * * *'   # QUICK sync (stock, price, orders, pushes)
    - cron: '32 1-23/2 * * *'   # QUICK sync
  push:                      # run right away whenever the sync script or this file is updated
    branches: [main]
    paths:
      - 'spapi-sync.js'
      - '.github/workflows/spapi-sync-aikm.yml'
  workflow_dispatch:         # also triggered by cron-job.org (GitHub's own timer skips many runs)
    inputs:
      mode:
        description: 'fast = stock/price/orders only, full = everything incl. competitor prices'
        default: 'full'
# Never run two syncs for the same account at once - a new one waits for the current one.
concurrency:
  group: spapi-sync-aikm
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install amazon-sp-api firebase-admin

      # Saved copy of the LOTS catalogue (saves ~25 console Firebase reads per run; the script
      # re-reads it only when it changed). Shared by both Amazon accounts.
      - name: Restore saved LOTS catalogue
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/lots-catalog.json
          key: lots-catalog-${{ github.run_id }}
          restore-keys: lots-catalog-

      - name: Restore saved snapshot copy
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .cache/snapshot-copy.json
          key: snap-aikm-${{ github.run_id }}
          restore-keys: snap-aikm-

      - name: Run SP-API sync
        env:
          # Same Amazon developer app as Praso / Sasta Store - only the refresh token and seller ID differ per account.
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SPAPI_REFRESH_TOKEN: ${{ secrets.SPAPI_REFRESH_TOKEN_AIKM }}
          SPAPI_SELLER_ID: ${{ secrets.SPAPI_SELLER_ID_AIKM }}
          # Same two Firebase projects as Praso (the Amazon page reads from the SP-API one).
          FIREBASE_SERVICE_ACCOUNT_SPAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPAPI }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Quick sync on the 15-minute schedules, full sync otherwise (incl. manual / code updates).
          SYNC_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || (github.event_name == 'schedule' && github.event.schedule != '32 */2 * * *' && 'fast') || 'full' }}
          ACCOUNT_LABEL: aikm
          ACCOUNT_NAME: AIKM Pharma
        shell: bash
        run: |
          if [ -z "$SPAPI_REFRESH_TOKEN" ] || [ -z "$SPAPI_SELLER_ID" ]; then echo "AIKM Amazon keys not added yet - nothing to do"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          node spapi-sync.js 2>&1 | tee run.log

      - name: Keep snapshot copy for the next run
        if: always() && hashFiles('.cache/snapshot-copy.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/snapshot-copy.json
          key: snap-aikm-${{ github.run_id }}

      - name: Keep LOTS catalogue copy for the next run
        if: always() && hashFiles('.cache/lots-catalog.json') != ''
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .cache/lots-catalog.json
          key: lots-catalog-${{ hashFiles('.cache/lots-catalog.json') }}

      - name: Report sync health to console
        if: always() && env.SKIP != '1'
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node report-health.js spapi_aikm "Amazon sync (AIKM Pharma)" run.log || true

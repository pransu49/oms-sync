name: Push NimbusPost tracking to OMS Guru

on:
  # runs by itself every time the NimbusPost sync finishes
  # after ProShip's 30-min status refresh (NimbusPost sync switched off 13 Nov 2026). Ship jobs start it by themselves.
  workflow_run:
    workflows: ['ProShip']
    types: [completed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true = only show what would be pushed'
        required: false
        default: 'false'

concurrency:
  group: oms-push-tracking
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  # ProShip finishes many kinds of runs — push only after its scheduled status refresh (ship jobs start this workflow themselves)
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "go=1" >> $GITHUB_OUTPUT; exit 0; fi
          ev="${{ github.event.workflow_run.event }}"
          echo "ProShip run started by: $ev"
          if [ "$ev" = "schedule" ]; then echo "go=1" >> $GITHUB_OUTPUT; else echo "go=0" >> $GITHUB_OUTPUT; fi

  push:
    needs: gate
    if: ${{ needs.gate.outputs.go == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - shell: bash
        run: node oms-push-tracking.js 2>&1 | tee run.log
        env:
          OMS_EMAIL: ${{ secrets.OMS_EMAIL }}
          OMS_PASSWORD: ${{ secrets.OMS_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_OMS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OMS }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}

      - name: Report sync health to console
        if: always()
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node report-health.js push "Tracking push to OMS" run.log || true

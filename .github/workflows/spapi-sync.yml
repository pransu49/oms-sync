name: SP-API Sync (Praso)

on:
  schedule:
    - cron: '10 * * * *'   # FULL sync (incl. competitor prices)
    - cron: '25,40,55 * * * *'   # QUICK sync (stock, price, orders, pushes)
  workflow_dispatch:         # also triggered by cron-job.org (GitHub's own timer skips many runs)
    inputs:
      mode:
        description: 'fast = stock/price/orders only, full = everything incl. competitor prices'
        default: 'full'
  push:                      # run right away whenever the sync script is updated
    branches: [main]
    paths:
      - 'spapi-sync.js'
      - '.github/workflows/spapi-sync.yml'

# Never run two syncs for the same account at once - a new one waits for the current one.
concurrency:
  group: spapi-praso
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install amazon-sp-api firebase-admin

      - name: Run SP-API sync
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SPAPI_REFRESH_TOKEN: ${{ secrets.SPAPI_REFRESH_TOKEN }}
          SPAPI_SELLER_ID: ${{ secrets.SPAPI_SELLER_ID }}
          FIREBASE_SERVICE_ACCOUNT_SPAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPAPI }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Quick sync on the 15-minute schedules, full sync otherwise (incl. manual / code updates).
          SYNC_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || (github.event_name == 'schedule' && github.event.schedule != '10 * * * *' && 'fast') || 'full' }}
          ACCOUNT_LABEL: praso
        shell: bash
        run: node spapi-sync.js 2>&1 | tee run.log

      - name: Report sync health to console
        if: always()
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node report-health.js spapi_praso "Amazon sync (Praso)" run.log || true

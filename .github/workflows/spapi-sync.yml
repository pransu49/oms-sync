name: SP-API Sync (Praso)

on:
  schedule:
    - cron: '10 * * * *'   # FULL sync (incl. competitor prices)
    - cron: '25,40,55 * * * *'   # QUICK sync (stock, price, orders, pushes)
  workflow_dispatch:         # also triggered by cron-job.org (GitHub's own timer skips many runs)
    inputs:
      mode:
        description: 'fast = stock/price/orders only, full = everything incl. competitor prices'
        default: 'full'
  push:                      # run right away whenever the sync script is updated
    branches: [main]
    paths:
      - 'spapi-sync.js'
      - '.github/workflows/spapi-sync.yml'

# Never run two syncs for the same account at once - a new one waits for the current one.
concurrency:
  group: spapi-praso
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write        # to start the other accounts' syncs (step below)
    steps:
      - uses: actions/checkout@v4

      # Owner 20 Nov 2026 (Munda GST/HSN pushes waited hours): GitHub's own timer skips most runs, and only Praso + Sasta are
      # started by cron-job.org. This Praso run therefore also starts Munda, Vishal and AIKM when their last run is 12+ min old
      # and none is running/waiting. Mode "fast" - the script upgrades it to a full sync itself when one is due (FULL_DUE_MS).
      - name: Start the other accounts' syncs if GitHub's timer skipped them
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for w in spapi-sync-munda.yml spapi-sync-vishal.yml spapi-sync-aikm.yml; do
            last=$(gh api "repos/${{ github.repository }}/actions/workflows/$w/runs?per_page=5" -q '[.workflow_runs[] | {s: .status, t: .created_at}]' 2>/dev/null || echo '[]')
            busy=$(echo "$last" | jq '[.[] | select(.s != "completed")] | length')
            newest=$(echo "$last" | jq -r '.[0].t // "1970-01-01T00:00:00Z"')
            age=$(( $(date -u +%s) - $(date -u -d "$newest" +%s) ))
            if [ "$busy" != "0" ]; then echo "$w: already running/waiting - skip"; continue; fi
            if [ "$age" -lt 720 ]; then echo "$w: last run ${age}s ago - skip"; continue; fi
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/$w/dispatches" -f ref=main -f 'inputs[mode]=fast' && echo "$w: started (last run ${age}s ago)"
          done

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install amazon-sp-api firebase-admin

      # Saved copy of the LOTS catalogue (saves ~25 console Firebase reads per run; the script
      # re-reads it only when it changed). Shared by both Amazon accounts.
      - name: Restore saved LOTS catalogue
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache/lots-catalog.json
          key: lots-catalog-${{ github.run_id }}
          restore-keys: lots-catalog-

      - name: Restore saved snapshot copy
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: .cache/snapshot-copy.json
          key: snap-praso-${{ github.run_id }}
          restore-keys: snap-praso-

      - name: Run SP-API sync
        env:
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SPAPI_REFRESH_TOKEN: ${{ secrets.SPAPI_REFRESH_TOKEN }}
          SPAPI_SELLER_ID: ${{ secrets.SPAPI_SELLER_ID }}
          FIREBASE_SERVICE_ACCOUNT_SPAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPAPI }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Quick sync on the 15-minute schedules, full sync otherwise (incl. manual / code updates).
          SYNC_MODE: ${{ (github.event_name == 'workflow_dispatch' && inputs.mode) || (github.event_name == 'schedule' && github.event.schedule != '10 * * * *' && 'fast') || 'full' }}
          ACCOUNT_LABEL: praso
        shell: bash
        run: node spapi-sync.js 2>&1 | tee run.log

      - name: Keep snapshot copy for the next run
        if: always() && hashFiles('.cache/snapshot-copy.json') != ''
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/snapshot-copy.json
          key: snap-praso-${{ github.run_id }}

      - name: Keep LOTS catalogue copy for the next run
        if: always() && hashFiles('.cache/lots-catalog.json') != ''
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: .cache/lots-catalog.json
          key: lots-catalog-${{ hashFiles('.cache/lots-catalog.json') }}

      - name: Report sync health to console
        if: always()
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          JOB_STATUS: ${{ job.status }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node report-health.js spapi_praso "Amazon sync (Praso)" run.log || true

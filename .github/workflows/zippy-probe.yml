name: Zippy probe (temporary)
on:
  push:
    branches: [zippy-probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm install firebase-admin
      - run: node probe/zippy-probe.js
        env:
          ZIPPY_REFRESH_TOKEN: ${{ secrets.ZIPPY_REFRESH_TOKEN }}
          ZIPPY_EMAIL: ${{ secrets.ZIPPY_EMAIL }}
          ZIPPY_PASSWORD: ${{ secrets.ZIPPY_PASSWORD }}

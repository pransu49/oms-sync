name: SP-API Sync (Sasta Store)

on:
  schedule:
    - cron: '0 */4 * * *'   # every 4 hours
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install amazon-sp-api firebase-admin

      - name: Run SP-API sync
        env:
          # Client ID/Secret reused from the same Amazon Developer app registration as Praso
          # (only the refresh token and seller ID are ever unique per seller account) -
          # if Sasta Store ends up authorized under a SEPARATE dev app instead, swap these two
          # to their own secrets (e.g. SPAPI_CLIENT_ID_SASTASTORE) instead of reusing Praso's.
          SPAPI_CLIENT_ID: ${{ secrets.SPAPI_CLIENT_ID }}
          SPAPI_CLIENT_SECRET: ${{ secrets.SPAPI_CLIENT_SECRET }}
          SPAPI_REFRESH_TOKEN: ${{ secrets.SPAPI_REFRESH_TOKEN_SASTASTORE }}
          SPAPI_SELLER_ID: ${{ secrets.SPAPI_SELLER_ID_SASTASTORE }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ACCOUNT_LABEL: sastastore
        run: node spapi-sync.js

<!-- ===================== EASY SHIP TAB (AIKM) =====================
     Paste this whole block in page.dalbhaat-admin-console.liquid, just ABOVE the line:
     <script src="{{ 'dalbhaat-admin-console.js' | asset_url }}" defer></script>
     It adds the "Easy Ship" item to the sidebar and its page. Nothing else changes. -->
<style>
html#aikm body #tab-easyship .es-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;}
html#aikm body #tab-easyship .es-state{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;border:1px solid var(--x-line);background:var(--x-surface);font-size:12.5px;font-weight:600;color:var(--x-text-2);}
html#aikm body #tab-easyship .es-dot{width:8px;height:8px;border-radius:50%;background:var(--x-muted);}
html#aikm body #tab-easyship .es-state.run .es-dot{background:var(--x-amber);animation:esPulse 1.2s infinite;}
html#aikm body #tab-easyship .es-state.ok .es-dot{background:var(--x-green);}
html#aikm body #tab-easyship .es-state.bad .es-dot{background:var(--x-red);}
@keyframes esPulse{50%{opacity:.35;}}
html#aikm body #tab-easyship .es-meta{font-size:12px;color:var(--x-muted);}
html#aikm body #tab-easyship .es-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;}
html#aikm body #tab-easyship .es-acc{display:flex;align-items:center;gap:14px;padding:12px 14px;border:1px solid var(--x-line);border-radius:10px;background:var(--x-surface-2);margin-bottom:8px;}
html#aikm body #tab-easyship .es-acc-ic{width:38px;height:38px;flex:0 0 38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--x-gold-soft);color:var(--x-gold);font-size:19px;}
html#aikm body #tab-easyship .es-acc-name{font-weight:600;font-size:13.5px;color:var(--x-text);}
html#aikm body #tab-easyship .es-acc-sub{font-size:12px;color:var(--x-muted);margin-top:2px;}
html#aikm body #tab-easyship .es-acc-info{flex:1;min-width:0;}
html#aikm body #tab-easyship .es-empty{padding:18px;text-align:center;color:var(--x-muted);font-size:13px;border:1px dashed var(--x-line-2);border-radius:10px;}
html#aikm body #tab-easyship .es-tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600;background:var(--x-red-soft);color:var(--x-red);}
html#aikm body #tab-easyship .es-tag.amber{background:var(--x-amber-soft);color:var(--x-amber);}
html#aikm body #tab-easyship .es-rule{font-size:12px;color:var(--x-muted);line-height:1.6;}
html#aikm body #tab-easyship .es-rule b{color:var(--x-text-2);}
html#aikm body #subtab-easyship .es-btn-main{background:var(--x-primary) !important;color:var(--x-primary-ink) !important;border-color:var(--x-primary) !important;}
html#aikm body #tab-easyship td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}
@media (max-width:1100px){html#aikm body #tab-easyship .es-grid{grid-template-columns:1fr;}}
</style>
<script>
(function () {
  if (window.__aikmEasyShip) return; window.__aikmEasyShip = true;
  var REPO = "pransu49/oms-sync", WF = "easyship.yml", TK = "aikm_gh_sync_token";

  /* ---------- 1. add sidebar item, page header and page ---------- */
  function mount() {
    var bar = document.getElementById("mainTabbar"), content = document.querySelector(".app-content");
    if (!bar || !content || document.getElementById("tab-easyship")) return;
    var b = document.createElement("button");
    b.className = "tabbtn"; b.dataset.tab = "easyship";
    b.innerHTML = '<i class="ti ti-truck-loading tab-ic"></i>Easy Ship<span class="rtab-count" id="esSideCount" style="display:none"></span>';
    var after = bar.querySelector('[data-tab="selfship"]');
    after ? after.insertAdjacentElement("afterend", b) : bar.appendChild(b);

    var sub = document.createElement("div");
    sub.className = "subtabbar no-print"; sub.id = "subtab-easyship"; sub.style.display = "none";
    sub.innerHTML = '<span class="subtab-label">Amazon Easy Ship</span>' +
      '<span class="es-meta">Auto 11:30 AM for next working day · 2 PM pickup · skips &gt;4 units or &gt;3 kg</span>' +
      '<span style="flex:1"></span>' +
      '<label class="es-meta" for="esDate" style="display:flex;align-items:center;gap:6px;">SLA date <input type="date" id="esDate" style="min-height:34px;width:150px;"></label>' +
      '<button type="button" class="subbtn" id="esDryBtn" title="Shows what would be packed — packs nothing"><i class="ti ti-eye"></i> Preview</button>' +
      '<button type="button" class="subbtn" id="esLabelsBtn" title="Builds the label PDFs again for orders already packed — packs nothing"><i class="ti ti-file-download"></i> Get labels</button>' +
      '<button type="button" class="subbtn" id="esTestBtn" title="Packs just 1 order — for testing"><i class="ti ti-flask"></i> Test 1 order</button>' +
      '<button type="button" class="subbtn es-btn-main" id="esRunBtn"><i class="ti ti-player-play"></i> Run now</button>';
    content.insertBefore(sub, content.firstChild);

    var p = document.createElement("div");
    p.id = "tab-easyship"; p.className = "tabpanel";
    p.innerHTML =
      '<div class="es-head"><span class="es-state" id="esState"><span class="es-dot"></span><span id="esStateTxt">Connecting…</span></span><span class="es-meta" id="esLastLine"></span></div>' +
      '<div class="cx-kpis" style="grid-template-columns:repeat(4,minmax(0,1fr)) !important;">' +
        kpi("esKpiPacked", "Packed (last run)", "esKpiPackedSub") + kpi("esKpiFailed", "Failed", "esKpiFailedSub") +
        kpi("esKpiCheck", "Check manually", "esKpiCheckSub") + kpi("esKpiNext", "Due tomorrow", "esKpiNextSub") +
      "</div>" +
      '<div class="es-grid"><div>' +
        '<div class="panel"><h2>Labels <span id="esLabelsFor" class="es-meta"></span><button type="button" class="btn-gold" id="esAllBtn" style="margin-left:auto;display:none;"><i class="ti ti-files"></i> Download all labels (1 PDF)</button></h2><div id="esLabels"></div></div>' +
        '<div class="panel"><h2>Failed — fix in OMS Guru <span class="es-meta" id="esFailedCount"></span></h2><div id="esFailed"></div></div>' +
        '<div class="panel"><h2>Skipped — bulky orders <span class="es-meta" id="esSkipCount"></span></h2><small class="hint">Not packed by the robot: more than 4 units, or heavier than 3 kg. Ship these yourself.</small><div id="esSkip" style="margin-top:10px"></div></div>' +
        '<div class="panel"><h2>Check manually <span class="es-meta" id="esCheckCount"></span></h2><small class="hint">Not packed — the two Easy Ship rules (no mobile number + no Self-Fulfilled tag) did not agree, or the order already has an invoice.</small><div id="esCheck" style="margin-top:10px"></div></div>' +
      '</div><div>' +
        '<div class="panel"><h2>Picklist <span class="es-meta" id="esPickCount"></span><button type="button" class="secondary" id="esPickPdfBtn" style="margin-left:auto;display:none;"><i class="ti ti-file-type-pdf"></i> Picklist PDF (A4)</button></h2><div id="esPick"></div></div>' +
        '<div class="panel"><h2>Off days <span class="es-meta">· Sundays are always off</span></h2><small class="hint">No auto-run and no pickup on these dates. The 11:30 AM run prepares the next working day.</small>' +
          '<div style="display:flex;gap:8px;margin:10px 0;"><input type="date" id="esOffInput" style="width:160px;"><button type="button" class="secondary" id="esOffAdd"><i class="ti ti-plus"></i> Add off day</button></div><div id="esOffList" class="mh-chips"></div><div class="es-meta" id="esNextWork" style="margin-top:8px;"></div></div>' +
        '<div class="panel"><h2>Coming up (Easy Ship in New)</h2><div id="esUpcoming"></div></div>' +
        '<div class="panel"><h2>How it works</h2><div class="es-rule">' +
          "<b>When:</b> every working day at 11:30 AM it packs orders for the <b>next working day</b> (Sundays and off days skipped). Run now = the date you pick.<br>" +
          "<b>Which orders:</b> Amazon New orders with <b>no buyer mobile</b> and <b>no Self-Fulfilled tag</b>, SLA date today (or overdue).<br>" +
          "<b>Skipped:</b> orders with <b>more than 4 units</b> or <b>over 3 kg</b> (OMS weight) — listed separately, never packed.<br>" +
          "<b>Pickup slot:</b> always <b>2:00–4:00 PM on the SLA date</b>, never earlier.<br>" +
          "<b>Labels:</b> one PDF per account, sorted by product, product name + qty already printed on each label.<br>" +
          "<b>Weights:</b> taken from OMS Guru.</div></div>" +
      "</div></div>";
    content.appendChild(p);

    var di = document.getElementById("esDate"); di.value = today(); di.min = today();
    di.addEventListener("change", function () { di.dataset.touched = "1"; });
    function pick() { return di.value || today(); }
    document.getElementById("esRunBtn").addEventListener("click", function () { var d = pick(); runNow({ dry_run: "false", limit: "0", sla_date: d }, "Pack ALL Easy Ship orders with SLA " + nice(d) + (d === today() ? " (plus overdue)" : "") + "?\nPickup: " + nice(d < today() ? today() : d) + ", 2:00–4:00 PM."); });
    document.getElementById("esTestBtn").addEventListener("click", function () { var d = pick(); runNow({ dry_run: "false", limit: "1", sla_date: d }, "Pack just 1 Easy Ship order with SLA " + nice(d) + " as a test?"); });
    document.getElementById("esLabelsBtn").addEventListener("click", function () { runNow({ dry_run: "false", limit: "0", sla_date: pick(), collect: "true" }); });
    document.getElementById("esDryBtn").addEventListener("click", function () { runNow({ dry_run: "true", limit: "0", sla_date: pick() }); });
  }
  function kpi(id, label, subId) {
    return '<div class="cx-kpi"><div class="cx-kpi-label">' + label + '</div><div class="cx-kpi-num" id="' + id + '">–</div><div class="cx-kpi-sub" id="' + subId + '">&nbsp;</div></div>';
  }
  mount(); document.addEventListener("DOMContentLoaded", mount);

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function today() { return new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10); }
  function addDays(iso, n) { var d = new Date(iso + "T00:00:00Z"); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
  var offList = [], offUnsub = null;
  function offDays() { return offList.slice().sort(); }
  function listenOff() {
    if (offUnsub || !mainDb()) return;
    offUnsub = mainDb().collection("aikm_admin").doc("easyShipSettings").onSnapshot(function (d) { offList = (d.exists && d.data().offDays) || []; if (data) render(); }, function () {});
  }
  function isWorking(iso) { return new Date(iso + "T00:00:00Z").getUTCDay() !== 0 && offDays().indexOf(iso) < 0; }
  function nextWorking(iso) { var d = addDays(iso, 1); for (var i = 0; i < 30 && !isWorking(d); i++) d = addDays(d, 1); return d; }
  function renderOff() {
    var el = $("esOffList"); if (!el) return;
    var od = offDays().filter(function (d) { return d >= today(); });
    el.innerHTML = od.length ? od.map(function (d) { return '<span class="mh-chip">' + nice(d) + ' <a href="#" data-es-off-del="' + d + '" title="Remove" style="color:var(--x-red);text-decoration:none;">×</a></span>'; }).join("") : '<span class="es-meta">No extra off days.</span>';
    $("esNextWork").innerHTML = "Next auto-run prepares: <b>SLA " + nice(nextWorking(today())) + "</b>" + (isWorking(today()) ? "" : " (today is off — no run today)");
  }
  async function saveOff(list) {
    if (!db()) return;
    if (!mainDb()) return toast("Still connecting — try again.", true);
    try { await mainDb().collection("aikm_admin").doc("easyShipSettings").set({ offDays: list, updatedAt: new Date().toISOString() }, { merge: true }); toast("Off days saved."); } catch (e) { toast("Could not save: " + e.message, true); }
  }
  document.addEventListener("click", function (e) {
    if (e.target.closest("#esOffAdd")) {
      var v = $("esOffInput").value; if (!v) return toast("Pick a date first.", true);
      var l = offDays(); if (l.indexOf(v) < 0) l.push(v);
      saveOff(l.filter(function (d) { return d >= addDays(today(), -30); })); $("esOffInput").value = "";
    }
    var del = e.target.closest("[data-es-off-del]");
    if (del) { e.preventDefault(); saveOff(offDays().filter(function (d) { return d !== del.dataset.esOffDel; })); }
  });
  function nice(iso) { if (!iso) return "–"; var d = new Date(iso + "T00:00:00Z"); return d.toLocaleDateString("en-IN", { day: "numeric", month: "short", timeZone: "UTC" }); }
  function when(ts) { if (!ts) return ""; var d = new Date(ts); return d.toLocaleString("en-IN", { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata" }); }
  function toast(msg, warn) {
    var t = document.createElement("div"); t.className = "mh-toast" + (warn ? " warn" : ""); t.textContent = msg;
    document.body.appendChild(t); requestAnimationFrame(function () { t.classList.add("show"); });
    setTimeout(function () { t.classList.remove("show"); setTimeout(function () { t.remove(); }, 300); }, 4500);
  }
  function table(head, rows) {
    return '<div class="table-scroll" style="max-height:360px;"><table class="data"><thead><tr>' + head.map(function (h) { return "<th>" + h + "</th>"; }).join("") +
      "</tr></thead><tbody>" + rows.join("") + "</tbody></table></div>";
  }

  /* ---------- 2. live data (reads only while this page is open) ---------- */
  var unsub = null, data = null, esDb = null;
  // Easy Ship data lives in the "aikm-oms-sync" Firebase project (its own free quota)
  var OMS_CFG = { apiKey: "AIzaSyCKvAQr48JeVTJzvwcCg0YBNf7SBdaCVsk", authDomain: "aikm-oms-sync.firebaseapp.com", projectId: "aikm-oms-sync",
    storageBucket: "aikm-oms-sync.firebasestorage.app", messagingSenderId: "464184383750", appId: "1:464184383750:web:4fb422b90e519a87d76687" };
  function db() {
    if (esDb) return esDb;
    if (typeof firebase === "undefined" || !firebase.initializeApp || !firebase.firestore) return null;
    try { var app = (firebase.apps || []).filter(function (a) { return a.name === "omsSync" || (a.options && a.options.projectId === "aikm-oms-sync"); })[0] || firebase.initializeApp(OMS_CFG, "omsSync"); esDb = app.firestore(); } catch (e) { return null; }
    return esDb;
  }
  function mainDb() { return typeof fbDb !== "undefined" && fbDb ? fbDb : null; }
  function listen() {
    if (unsub || !db()) return;
    unsub = db().collection("aikm_admin").doc("easyShip").onSnapshot(function (d) { data = d.exists ? d.data() : {}; render(); }, function () { setState("bad", "Could not read Easy Ship data"); });
  }
  function stop() { if (unsub) { unsub(); unsub = null; } if (offUnsub) { offUnsub(); offUnsub = null; } }
  document.addEventListener("click", function (e) {
    var t = e.target.closest(".tabbtn[data-tab]"); if (!t) return;
    if (t.dataset.tab === "easyship") { var w = setInterval(function () { if (db()) { clearInterval(w); listen(); } }, 500); listen(); }
    else stop();
  });
  document.addEventListener("visibilitychange", function () {
    var open = document.querySelector('.tabbtn.active[data-tab="easyship"]');
    if (document.hidden) stop(); else if (open) listen();
  });

  function setState(cls, txt) { var s = $("esState"); if (!s) return; s.className = "es-state " + (cls || ""); $("esStateTxt").textContent = txt; }

  function render() {
    if (!$("tab-easyship")) return;
    var live = data.live || {}, last = data.last || null, dry = data.lastDry || null;
    listenOff(); renderOff();
    var di = $("esDate"); if (di && !di.dataset.touched) di.value = nextWorking(today());
    var running = live.state === "running" && Date.now() - new Date(live.updatedAt).getTime() < 12 * 60000;
    setState(running ? "run" : live.state === "failed" ? "bad" : last ? "ok" : "", running ? live.step : live.state === "failed" ? live.step : last ? "Last run " + when(last.finishedAt) : "Not run yet");
    ["esRunBtn", "esTestBtn", "esDryBtn", "esLabelsBtn"].forEach(function (id) { if ($(id)) $(id).disabled = running; });

    // dry-run preview is shown when it is newer than the last real run
    var showDry = dry && (!last || dry.finishedAt > last.finishedAt);
    var cur = showDry ? dry : last;
    $("esLastLine").textContent = cur ? (showDry ? "Preview only (nothing packed) · " : "") + "SLA " + nice(cur.target) + " · " + (cur.trigger === "schedule" ? "auto 11:30 AM" : cur.trigger || "manual") + (cur.limit ? " · test (" + cur.limit + " order)" : "") : "";

    var failed = (cur && cur.failed) || [], check = (cur && cur.check) || [];
    document.querySelector("#tab-easyship .cx-kpi-label").textContent = showDry ? "Ready to pack (preview)" : "Packed (last run)";
    $("esKpiPacked").textContent = cur ? (showDry ? (cur.preview || []).length : cur.packed || 0) : "–";
    $("esKpiPackedSub").textContent = cur ? (showDry ? "would be packed" : "of " + (cur.found || 0) + " Easy Ship due") : "";
    $("esKpiFailed").textContent = cur ? failed.length : "–";
    $("esKpiFailedSub").textContent = failed.length ? "need fixing in OMS" : cur ? "none" : "";
    $("esKpiCheck").textContent = cur ? check.length : "–";
    $("esKpiCheckSub").textContent = check.length ? "rules disagree" : cur ? "none" : "";
    var up = (cur && cur.upcoming) || {}, tom = addDays(today(), 1), nx = up[tom] || { total: 0 };
    $("esKpiNext").textContent = cur ? nx.total : "–";
    $("esKpiNextSub").textContent = "SLA " + nice(tom);
    document.querySelectorAll("#tab-easyship .cx-kpi")[1].classList.toggle("cx-kpi-danger", failed.length > 0);
    document.querySelectorAll("#tab-easyship .cx-kpi")[2].classList.toggle("cx-kpi-warn", check.length > 0);
    var sc = $("esSideCount"); if (sc) { sc.textContent = failed.length + check.length; sc.style.display = failed.length + check.length ? "" : "none"; }

    // labels
    var lf = last && last.labelFiles ? last.labelFiles : {};
    var accs = Object.keys(lf);
    $("esAllBtn").style.display = accs.length > 1 ? "" : "none";
    $("esPickPdfBtn").style.display = (last && (last.picklist || []).length) ? "" : "none";
    $("esLabelsFor").textContent = last ? "· SLA " + nice(last.target) + " · " + when(last.finishedAt) : "";
    $("esLabels").innerHTML = accs.length ? accs.map(function (a) {
      var f = lf[a];
      return '<div class="es-acc"><div class="es-acc-ic"><i class="ti ti-file-type-pdf"></i></div><div class="es-acc-info"><div class="es-acc-name">' + esc(a) + '</div><div class="es-acc-sub">' +
        f.pages + " labels · " + (f.sizeKB > 1024 ? (f.sizeKB / 1024).toFixed(1) + " MB" : f.sizeKB + " KB") + '</div></div><button type="button" class="btn-gold" data-es-dl="' + esc(a) + '"><i class="ti ti-download"></i> Download PDF</button></div>';
    }).join("") : '<div class="es-empty">No labels yet' + (showDry ? " — this was only a preview." : ".") + "</div>";
    (data.history || []).slice(1).forEach(function (h) {
      Object.keys(h.labelFiles || {}).forEach(function (a) {
        $("esLabels").insertAdjacentHTML("beforeend", '<div class="es-acc" style="opacity:.75"><div class="es-acc-ic" style="background:var(--x-raise);color:var(--x-muted)"><i class="ti ti-history"></i></div><div class="es-acc-info"><div class="es-acc-name">' + esc(a) + '</div><div class="es-acc-sub">Earlier run · SLA ' + nice(h.target) + " · " + h.labelFiles[a].pages + ' labels</div></div><button type="button" class="secondary" data-es-dl="' + esc(a) + '" data-es-run="' + esc(h.runId) + '"><i class="ti ti-download"></i></button></div>');
      });
    });

    var skip = (cur && cur.skipped) || [];
    $("esSkipCount").textContent = skip.length ? "· " + skip.length : "";
    $("esSkip").innerHTML = skip.length ? table(["Order", "Account", "Product", "Why skipped"], skip.map(function (f) {
      return "<tr><td class='cx-awb'>" + esc(f.orderId) + "</td><td>" + esc(f.account) + "</td><td>" + esc(f.sku) + "</td><td><span class='es-tag amber'>" + esc(f.reason) + "</span></td></tr>";
    })) : '<div class="es-empty">Nothing skipped.</div>';

    // failed / check
    $("esFailedCount").textContent = failed.length ? "· " + failed.length : "";
    $("esFailed").innerHTML = failed.length ? table(["Order", "Account", "Product", "Reason"], failed.map(function (f) {
      return "<tr><td class='cx-awb'>" + esc(f.orderId) + "</td><td>" + esc(f.account) + "</td><td>" + esc(f.sku) + "</td><td><span class='es-tag'>" + esc(f.reason) + "</span></td></tr>";
    })) : '<div class="es-empty">Nothing failed.</div>';
    $("esCheckCount").textContent = check.length ? "· " + check.length : "";
    $("esCheck").innerHTML = check.length ? table(["Order", "Account", "SLA", "Reason"], check.map(function (f) {
      return "<tr><td class='cx-awb'>" + esc(f.orderId) + "</td><td>" + esc(f.account) + "</td><td>" + nice(f.sla) + "</td><td><span class='es-tag amber'>" + esc(f.reason) + "</span></td></tr>";
    })) : '<div class="es-empty">Nothing to check.</div>';

    // picklist (real run) or preview list (dry run)
    if (showDry && !(last && (last.picklist || []).length)) {
      var pv = cur.preview || [], agg = {};
      pv.forEach(function (o) { agg[o.account] = (agg[o.account] || 0) + 1; });
      $("esPickCount").textContent = "· preview";
      $("esPick").innerHTML = pv.length ? table(["Account", "Orders"], Object.keys(agg).map(function (a) { return "<tr><td>" + esc(a) + "</td><td class='num'>" + agg[a] + "</td></tr>"; })) : '<div class="es-empty">Nothing due.</div>';
    } else {
      var pk = (last && last.picklist) || [];
      $("esPickCount").textContent = pk.length ? "· SLA " + nice(last.target) + " · " + pk.length + " products · " + pk.reduce(function (s, x) { return s + x.qty; }, 0) + " units" : "";
      $("esPick").innerHTML = pk.length ? table(["Product", "Qty"], pk.map(function (x) { return "<tr><td>" + esc(x.sku) + "</td><td class='num'>" + x.qty + "</td></tr>"; })) : '<div class="es-empty">No packed orders yet.</div>';
    }

    // upcoming
    var days = Object.keys(up).filter(function (k) { return k !== "unknown"; }).sort();
    $("esUpcoming").innerHTML = days.length ? table(["SLA date", "Orders", "By account"], days.slice(0, 8).map(function (k) {
      var ba = up[k].byAccount || {};
      return "<tr><td>" + nice(k) + (k < today() ? " <span class='es-tag'>overdue</span>" : k === today() ? " <span class='es-tag amber'>today</span>" : "") + "</td><td class='num'>" + up[k].total + "</td><td class='es-meta'>" + Object.keys(ba).map(function (a) { return esc(a) + " " + ba[a]; }).join(" · ") + "</td></tr>";
    })) : '<div class="es-empty">Shows after the first run.</div>';
  }

  /* ---------- 3. download a label PDF (stored in parts) ---------- */
  document.addEventListener("click", async function (e) {
    var btn = e.target.closest("[data-es-dl]"); if (!btn || !db()) return;
    var acc = btn.dataset.esDl, runId = btn.dataset.esRun;
    var src = runId ? (data.history || []).filter(function (h) { return h.runId === runId; })[0] : data.last;
    var f = src && src.labelFiles && src.labelFiles[acc]; if (!f) return;
    var old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> Preparing…';
    try {
      var parts = await Promise.all(f.docIds.map(function (id) { return db().collection("aikm_admin").doc("easyShip").collection("labels").doc(id).get(); }));
      var bytes = parts.map(function (d) { var b = d.get("data"); return b && b.toUint8Array ? b.toUint8Array() : new Uint8Array(0); });
      var blob = new Blob(bytes, { type: "application/pdf" });
      var a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = f.fileName || ("EasyShip_" + acc + ".pdf"); document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    } catch (err) { toast("Download failed: " + err.message, true); }
    btn.disabled = false; btn.innerHTML = old;
  });

  /* ---------- 3b. one PDF with every account's labels ---------- */
  var libs = {};
  function loadLib(url, test) {
    if (test()) return Promise.resolve();
    if (libs[url]) return libs[url];
    libs[url] = new Promise(function (res, rej) { var sc = document.createElement("script"); sc.src = url; sc.onload = function () { res(); }; sc.onerror = function () { delete libs[url]; rej(new Error("could not load " + url)); }; document.head.appendChild(sc); });
    return libs[url];
  }
  async function labelBytes(f) {
    var parts = await Promise.all(f.docIds.map(function (id) { return db().collection("aikm_admin").doc("easyShip").collection("labels").doc(id).get(); }));
    var arrs = parts.map(function (d) { var b = d.get("data"); return b && b.toUint8Array ? b.toUint8Array() : new Uint8Array(0); });
    var n = arrs.reduce(function (a, x) { return a + x.length; }, 0), out = new Uint8Array(n), o = 0;
    arrs.forEach(function (x) { out.set(x, o); o += x.length; });
    return out;
  }
  function saveBlob(blob, name) {
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }
  document.addEventListener("click", async function (e) {
    var btn = e.target.closest("#esAllBtn"); if (!btn || !db() || !data.last) return;
    var lf = data.last.labelFiles || {}, accs = Object.keys(lf); if (!accs.length) return;
    var old = btn.innerHTML; btn.disabled = true;
    try {
      btn.innerHTML = '<i class="ti ti-loader"></i> Loading…';
      await loadLib("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js", function () { return window.PDFLib; });
      var out = await PDFLib.PDFDocument.create(), pages = 0;
      for (var i = 0; i < accs.length; i++) {
        btn.innerHTML = '<i class="ti ti-loader"></i> ' + esc(accs[i]) + " (" + (i + 1) + "/" + accs.length + ")…";
        var src = await PDFLib.PDFDocument.load(await labelBytes(lf[accs[i]]), { ignoreEncryption: true });
        var cp = await out.copyPages(src, src.getPageIndices());
        cp.forEach(function (pg) { out.addPage(pg); }); pages += cp.length;
      }
      btn.innerHTML = '<i class="ti ti-loader"></i> Saving ' + pages + " labels…";
      var bytes = await out.save({ useObjectStreams: true });
      saveBlob(new Blob([bytes], { type: "application/pdf" }), "EasyShip_ALL_SLA-" + (data.last.target || today()) + ".pdf");
      toast(pages + " labels in one PDF (" + accs.join(", ") + ").");
    } catch (err) { toast("Download failed: " + err.message, true); }
    btn.disabled = false; btn.innerHTML = old;
  });

  /* ---------- 3c. premium compact A4 picklist PDF ---------- */
  document.addEventListener("click", async function (e) {
    var btn = e.target.closest("#esPickPdfBtn"); if (!btn || !data.last) return;
    var L = data.last, pk = (L.picklist || []).slice(); if (!pk.length) return;
    var old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<i class="ti ti-loader"></i> Building…';
    try {
      await loadLib("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", function () { return window.jspdf; });
      await loadLib("https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js", function () { return window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API && window.jspdf.jsPDF.API.autoTable; });
      var NAVY = [14, 26, 46], GOLD = [201, 162, 74], CREAM = [250, 246, 236], INK = [20, 33, 58], MUTE = [107, 115, 133];
      var doc = new jspdf.jsPDF({ unit: "mm", format: "a4", compress: true }), W = 210, M = 10;
      var units = pk.reduce(function (a, x) { return a + x.qty; }, 0);
      var lf = L.labelFiles || {};
      var gen = new Date().toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true, timeZone: "Asia/Kolkata" });
      // sort by product name so pickers walk the shelf in order
      pk.sort(function (a, b) { var n = function (s) { var k = s.indexOf(" - "); return k > 0 ? s.slice(k + 3) : s; }; return n(a.sku).localeCompare(n(b.sku)); });
      var rows = pk.map(function (x, i) {
        var k = x.sku.indexOf(" - "), code = k > 0 ? x.sku.slice(0, k) : x.sku, name = k > 0 ? x.sku.slice(k + 3) : "";
        return [i + 1, name || code, x.qty, ""];
      });
      function header() {
        doc.setFillColor.apply(doc, NAVY); doc.rect(0, 0, W, 22, "F");
        doc.setFillColor.apply(doc, GOLD); doc.rect(0, 22, W, 0.8, "F");
        doc.setTextColor.apply(doc, GOLD); doc.setFont("helvetica", "bold"); doc.setFontSize(12.5);
        doc.text("AIKM PHARMA PRIVATE LIMITED", M, 10);
        doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
        doc.text("Amazon Easy Ship  ·  Picklist", M, 16);
        doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor.apply(doc, GOLD);
        doc.text("SLA " + nice(L.target), W - M, 10, { align: "right" });
        doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(220, 224, 232);
        doc.text("Pickup 2:00–4:00 PM  ·  Generated " + gen, W - M, 16, { align: "right" });
      }
      header();
      // summary strip
      var y = 27, boxes = [["PRODUCTS", String(pk.length)], ["UNITS", String(units)], ["ORDERS", String(L.packed || 0)]], bw = 30;
      boxes.forEach(function (b, i) {
        var x = M + i * (bw + 3);
        doc.setFillColor.apply(doc, CREAM); doc.setDrawColor.apply(doc, GOLD); doc.setLineWidth(0.25); doc.roundedRect(x, y, bw, 12, 1.5, 1.5, "FD");
        doc.setFontSize(6.5); doc.setTextColor.apply(doc, MUTE); doc.setFont("helvetica", "bold"); doc.text(b[0], x + 3, y + 4.2);
        doc.setFontSize(12); doc.setTextColor.apply(doc, INK); doc.text(b[1], x + 3, y + 10);
      });
      doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor.apply(doc, MUTE);
      var lx = M + 3 * (bw + 3) + 4;
      doc.setFont("helvetica", "bold"); doc.text("LABELS BY ACCOUNT", lx, y + 3.4);
      doc.setFont("helvetica", "normal"); doc.setTextColor.apply(doc, INK);
      Object.keys(lf).forEach(function (a, i) { doc.text(a + "  " + lf[a].pages, lx + (i % 2) * 52, y + 7.6 + Math.floor(i / 2) * 3.6); });
      doc.autoTable({
        startY: y + 16, margin: { left: M, right: M, top: 26, bottom: 12 },
        head: [["#", "Product", "Qty", "Picked"]], body: rows,
        theme: "plain", styles: { font: "helvetica", fontSize: 7.6, cellPadding: { top: 0.85, bottom: 0.85, left: 1.6, right: 1.6 }, textColor: INK, lineColor: [230, 224, 210], lineWidth: { bottom: 0.15 }, overflow: "ellipsize" },
        headStyles: { fillColor: NAVY, textColor: GOLD, fontStyle: "bold", fontSize: 7, cellPadding: { top: 2, bottom: 2, left: 1.6, right: 1.6 } },
        alternateRowStyles: { fillColor: [252, 250, 245] },
        columnStyles: { 0: { cellWidth: 8, halign: "right", textColor: MUTE }, 1: { cellWidth: 154 }, 2: { cellWidth: 14, halign: "right", fontStyle: "bold", fontSize: 8.6 }, 3: { cellWidth: 14, halign: "center" } },
        didDrawCell: function (d) { if (d.section === "body" && d.column.index === 3) { doc.setDrawColor.apply(doc, MUTE); doc.setLineWidth(0.25); doc.rect(d.cell.x + d.cell.width / 2 - 1.6, d.cell.y + d.cell.height / 2 - 1.6, 3.2, 3.2); } },
        didDrawPage: function (d) { if (d.pageNumber > 1) header(); }
      });
      var fy = doc.lastAutoTable.finalY + 4;
      if (fy < 285) { doc.setFont("helvetica", "bold"); doc.setFontSize(8.5); doc.setTextColor.apply(doc, INK); doc.text("Total units: " + units, W - M, fy, { align: "right" }); }
      var n = doc.getNumberOfPages();
      for (var i = 1; i <= n; i++) {
        doc.setPage(i); doc.setFontSize(6.8); doc.setTextColor.apply(doc, MUTE); doc.setFont("helvetica", "normal");
        doc.text("Picked by ____________________     Checked by ____________________", M, 292);
        doc.text("Page " + i + " of " + n, W - M, 292, { align: "right" });
      }
      doc.save("Picklist_EasyShip_SLA-" + (L.target || today()) + ".pdf");
    } catch (err) { toast("Picklist PDF failed: " + err.message, true); }
    btn.disabled = false; btn.innerHTML = old;
  });

  /* ---------- 4. Run now (same shared GitHub token as the other Sync-now buttons) ---------- */
  async function getToken() {
    var t = "";
    try { if (mainDb()) { var d = await mainDb().collection("aikm_admin").doc("ghSync").get(); t = (d.exists && d.data().token) || ""; } } catch (e) {}
    if (!t) try { t = localStorage.getItem(TK) || ""; } catch (e) {}
    return String(t).replace(/^\s*bearer\s+/i, "").trim();
  }
  async function runNow(inputs, confirmMsg) {
    if (!db()) { toast("Still connecting — try again in a few seconds.", true); return; }
    if (confirmMsg && !confirm(confirmMsg + "\n\nThis books Amazon pickups and cannot be undone.")) return;
    var tok = await getToken();
    if (!tok) { toast("GitHub token missing — click any 'Sync OMS now' button once to set it up, then try again.", true); return; }
    inputs.trigger = "console"; inputs.sla_date = inputs.sla_date || "";
    setState("run", "Starting…");
    try {
      var r = await fetch("https://api.github.com/repos/" + REPO + "/actions/workflows/" + WF + "/dispatches", {
        method: "POST", headers: { Accept: "application/vnd.github+json", Authorization: "Bearer " + tok, "Content-Type": "application/json" },
        body: JSON.stringify({ ref: "main", inputs: inputs }) });
      if (r.status !== 204) throw new Error("GitHub said " + r.status);
      toast(inputs.collect === "true" ? "Collecting labels — about 3–10 minutes." : inputs.dry_run === "true" ? "Preview started — results in about 2–4 minutes." : "Easy Ship run started — labels appear here when done (5–20 minutes).");
      listen();
    } catch (err) { setState("bad", "Could not start: " + err.message); toast("Could not start: " + err.message, true); }
  }
})();
</script>
